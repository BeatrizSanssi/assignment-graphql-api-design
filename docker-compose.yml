version: '3'
services:
  app:
    build: .
    container_name: graphql-api
    ports: 
     - "8081:8081"
    # depends_on:
    #   mongo:
    #     condition: service_healthy
    environment: 
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=movieDB
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NODEJS_EXPRESS_PORT=${NODEJS_EXPRESS_PORT}
      - DB_CONNECTION_STRING=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/graphql-api-db?authSource=admin
      - CSV_FILE_PATH=/app/archive/movies_metadata.csv
      - ACTORS_CSV_PATH=/app/archive/credits.csv
      - RATINGS_CSV_PATH=/app/archive/ratings_small.csv

    # env_file:
    #   - .env
    # volumes:
    #   - .:/app
    # restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: movieDB
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  # api:
  #   build: .
  #   container_name: graphql-api
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     DB_CONNECTION_STRING: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/graphql-api-db?authSource=admin
  #   command: ./entrypoint.sh
  #   volumes:
  #     - .:/app
  #   restart: unless-stopped

volumes:
  mongo-data:
  