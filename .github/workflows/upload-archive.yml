name: Manual CSV Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Upload archive folder
        if: github.actor != 'nektos/act'  # 👈 Skip this step when running with act
        uses: actions/upload-artifact@v4
        with:
          name: csv-archive
          path: archive/