name: CI/CD - Test, Build and Deploy

on:
  push:
    branches: [main]

    # services:
    #   mongo:
    #     image: mongo
    #     ports:
          # - 27017:27017
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      MONGO_USER: ${{ secrets.MONGO_USER }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      DB_CONNECTION_STRING: mongodb://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@mongo:27017/graphql-api-db?authSource=admin
      BASE_URL: http://localhost:8081/graphql

    services:
      mongo:
        image: mongo:latest
        ports:
          - "27017:27017"
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Show container logs
        run: docker logs graphql-api
        
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build & Start Docker containers
        run: docker compose -f docker-compose.yml up -d --build

      - name: Show container logs
        run: docker logs graphql-api

      - name: Wait for API to be ready
        run: |
          echo "Waiting for GraphQL API to be ready..."
          for i in {1..20}; do
            if curl -s http://localhost:8081/graphql > /dev/null; then
              echo "✅ API is up!"
              break
            fi
            echo "⏳ Waiting ($i)..."
            sleep 3
          done

      - name: Seed test database
        run: docker exec graphql-api node scripts/seed-test-db.js

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman tests
        run: |
          newman run tests/collection.json \
            --environment tests/environment.json \
            --delay-request 2000 \
            --timeout 60000

      - name: Cleanup test database
        run: docker exec graphql-api node scripts/cleanup-test-db.js

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: bsan89/assignment-api-design-api:latest