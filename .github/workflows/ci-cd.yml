  docker: 
    runs-on: ubuntu-latest
    needs: build

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
        
      - name: Show Docker Compose config
        run: docker compose config

      - name: List all running containers
        run: docker ps -a

      - name: Show MongoDB container logs
        run: docker logs movieDB

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: .
      #     push: true
      #     tags: ${{ secrets.DOCKER_USERNAME }}/assignment-api-design-api:latest
      
      - name: Set up environment variables
        run: |
          echo "MONGO_USER=${{ secrets.MONGO_USER }}" >> .env
          echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env
          echo "DB_CONNECTION_STRING=mongodb://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@mongo:27017/graphql-api-db?authSource=admin" >> .env
        
      - name: Run Docker Compose
        run: |
          docker compose --env-file .env up -d

      - name: Show Docker logs
        run: docker logs $(docker ps --format '{{.Names}}' | grep graphql-api || true)
      
      - name: Verify Containers are up and running
        run: |
          docker ps

      - name: Wait for API to be ready
        run: |
          echo "Waiting for GraphQL API to be ready..."
          for i in {1..20}; do
            if curl -s http://localhost:8081/graphql > /dev/null; then
              echo "API is up!"
              exit 0
            fi
            echo "⏳ Waiting ($i)..."
            sleep 3
          done
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/assignment-api-design-api:latest
