name: CI/CD - Test, Build and Deploy

on:
  push:
    branches: 
      - main

  pull_request:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

  docker: 
    runs-on: ubuntu-latest
    needs: build

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v3
          
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
  
      # - name: List all running containers
      #   run: docker ps -a
  
      # - name: Login to DockerHub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }} 
            
      - name: Set env variables
        run: |
          echo "MONGO_USER=${{ secrets.MONGO_USER }}" >> .env
          echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env
          echo "NODEJS_EXPRESS_PORT=8081" >> .env
          echo "DOCKER=true" >> .env
          echo "DB_CONNECTION_STRING=mongodb://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@mongo:27017/graphql-api-db?authSource=admin" >> .env
          echo "MOVIES_CSV_PATH=/app/archive/movies_metadata.csv" >> .env
          echo "ACTORS_CSV_PATH=/app/archive/credits.csv" >> .env
          echo "RATINGS_CSV_PATH=/app/archive/ratings.csv" >> .env

      - name: Remove existing MongoDB volume
        run: docker volume rm assignment-graphql-api-design_mongo-data || true
        
      - name: Tear down existing containers
        run: docker compose down  
        
      - name: Run Docker Compose
        run: docker compose up --build -d

      - name: Restore MongoDB dump
        run: |
          docker exec mongo mongorestore --username=root --password=secret --authenticationDatabase=admin /dump
      
      - name: Show Docker logs
        run: docker logs graphql-api || true
      
      - name: Debug container status before waiting
        run: docker ps -a && docker logs graphql-api || true 

      - name: Wait for API to be ready
        run: |
          echo "Waiting for GraphQL API to be ready..."
          for i in {1..20}; do
            if curl -s https://cscloud6-136.lnu.se/graphql-api/graphql > /dev/null; then
              echo "✅ API is up!"
              exit 0
            fi
            echo "⏳ Waiting ($i)..."
            sleep 3
          done
          echo "❌ API not ready in time"
          docker logs graphql-api || true
          exit 1

      # - name: Seed DB
      #   run: docker exec graphql-api node seed.js
      #   env:
      #     DOCKER: true
      #     DB_CONNECTION_STRING: mongodb://root:secret@mongo:27017/graphql-api-db?authSource=admin
      #     MOVIES_CSV_PATH: /app/archive/movies_metadata.csv
      #     ACTORS_CSV_PATH: /app/archive/credits.csv
      #     RATINGS_CSV_PATH: /app/archive/ratings.csv

      - name: Verify Database Collections
        run: |
          echo "Movies count:"
          docker exec mongo mongosh --quiet --username root --password secret --authenticationDatabase admin --eval 'db = db.getSiblingDB("graphql-api-db"); print(db.movies.countDocuments())'
          echo "Actors count:"
          docker exec mongo mongosh --quiet --username root --password secret --authenticationDatabase admin --eval 'db = db.getSiblingDB("graphql-api-db"); print(db.actors.countDocuments())'
          echo "Ratings count:"
          docker exec mongo mongosh --quiet --username root --password secret --authenticationDatabase admin --eval 'db = db.getSiblingDB("graphql-api-db"); print(db.ratings.countDocuments())'
  
  deploy:
    runs-on : ubuntu-latest
    needs: [build, docker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # - name: Install Docker
      #   run: |
      #     sudo apt-get update
      #     curl -fsSL https://get.docker.com | sh

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/assignment-api-design:latest


